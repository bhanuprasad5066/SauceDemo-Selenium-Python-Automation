[pytest]

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

addopts = -v -s

log_cli = true

log_cli_level = INFO

log_file = logs/pytest_execution.log

log_file_level = INFO

log_file_format = %(asctime)s | %(levelname)s | %(message)s

log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
 markers =
    smoke: Essential application functionality tests
    regression: Complete functional regression tests
    sanity: Quick verification tests
    critical: Business-critical application workflows
    checkout: Checkout functionality tests
    inventory: Inventory functionality tests
    cart: Shopping cart functionality tests
    login: Login functionality tests