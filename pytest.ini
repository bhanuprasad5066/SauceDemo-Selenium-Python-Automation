[pytest]

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

addopts = -v -s

log_cli = true

log_cli_level = INFO

log_file = logs/pytest_execution.log

log_file_level = INFO

log_file_format = %(asctime)s | %(levelname)s | %(message)s

log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: Smoke testing
    regression: Regression testing
    sanity: Sanity testing
    checkout: Checkout testing
    inventory: Inventory testing