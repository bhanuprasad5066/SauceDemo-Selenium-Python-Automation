name: SauceDemo Selenium Automation CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saucedemo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-tests:

    name: Selenium Automation Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # 1. Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # 4. Verify environment
      - name: Verify Environment
        run: |
          python --version
          google-chrome --version

      # 5. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl pytest-xdist pytest-cov ruff

      # 6. Create directories
      - name: Create Test Directories
        run: |
          mkdir -p reports
          mkdir -p screenshots
          mkdir -p logs

      # 7. Code quality check
      - name: Run Ruff Code Quality Check
        run: |
          ruff check .

      # 8. Execute parallel Selenium tests
      - name: Run Selenium Tests
        run: |
          pytest -n 2 \
            --cov=pages \
            --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --html=reports/pytest_report.html \
            --self-contained-html

      # 9. Upload HTML and coverage reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-test-reports
          path: reports/
          if-no-files-found: warn

      # 10. Upload failure screenshots
      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # 11. Upload execution logs
      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-execution-logs
          path: logs/
          if-no-files-found: ignore
          