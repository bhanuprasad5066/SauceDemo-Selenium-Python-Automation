name: SauceDemo Selenium Automation CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:

    name: Selenium Automation Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # Step 1: Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      # Step 3: Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # Step 4: Verify Environment
      - name: Verify Python and Chrome
        run: |
          python --version
          google-chrome --version

      # Step 5: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      # Step 6: Create Report Directories
      - name: Create Test Directories
        run: |
          mkdir -p reports
          mkdir -p screenshots
          mkdir -p logs

      # Step 7: Execute Automation Tests
      - name: Run Selenium Pytest Suite
        run: |
          pytest -v -s \
            --html=reports/pytest_report.html \
            --self-contained-html

      # Step 8: Upload HTML Report
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-html-report
          path: reports/
          if-no-files-found: warn

      # Step 9: Upload Failure Screenshots
      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # Step 10: Upload Execution Logs
      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-execution-logs
          path: logs/
          if-no-files-found: ignore